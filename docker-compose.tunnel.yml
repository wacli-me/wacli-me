services:
  wacli-me:
    image: wacli-me:tunnel
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${WACLI_UID:-10001}:${WACLI_GID:-10001}"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      HOME: /tmp
      WACLI_BIN: /app/bin/wacli
      WACLI_ME_TENANTS: /app/config/tenants.json
      WACLI_ME_STORES: /app/stores
      WACLI_ME_DEFAULT_PLAN: ${WACLI_ME_DEFAULT_PLAN:-self-hosted}
      WACLI_SYNC_MODE: ${WACLI_SYNC_MODE:-on-request}
      WACLI_SYNC_IDLE_MS: ${WACLI_SYNC_IDLE_MS:-5000}
    ports:
      - "127.0.0.1:${WACLI_ME_LOCAL_PORT:-8787}:8787"
    volumes:
      - ./config:/app/config
      - ./stores:/app/stores
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.15@sha256:119799b778ba8411a124f53588f9dc837fd62ba03e5fadf77d675123c92ab58e
    restart: unless-stopped
    depends_on:
      wacli-me:
        condition: service_healthy
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:-}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      MCP_SERVER_URL: http://wacli-me:8787/mcp
      MCP_EXTRA_HEADERS: "Authorization: Bearer ${WACLI_ME_TENANT_TOKEN:-}"
      MCP_DISCOVERY_EXTRA_HEADERS: "Authorization: Bearer ${WACLI_ME_TENANT_TOKEN:-}"
      HEALTH_LISTEN_ADDR: "0.0.0.0:8080"
      ALLOW_REMOTE_UI: "true"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "127.0.0.1:${TUNNEL_UI_PORT:-8092}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
